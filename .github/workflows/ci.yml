name: Public surface
on: [push, pull_request, workflow_dispatch]
jobs:
  public-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      POSTGRES_PASSWORD: ci-only-database-password
      DASHBOARD_POSTGRES_PASSWORD: ci-only-dashboard-password
      HOST_PROJECT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements.survival-serving.txt -r requirements.survival-training.txt
      - run: python -m pip check
      - run: python scripts/preflight.py --profile full --tracked --json > preflight.json
      - run: docker compose config --quiet
      - run: docker compose build spark-master
      - run: docker compose --profile training build airflow dashboard survival-serving survival-training
      - run: docker compose up -d postgres kafka spark-master spark-worker-1 spark-worker-2 airflow
      - run: docker compose run --rm postgres-init
      - run: docker compose run --rm topic-init
      - run: docker compose run --rm --no-deps spark-submit /opt/spark/bin/spark-submit --master 'local[1]' scripts/spark_smoke.py
      - if: always()
        run: docker compose down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-preflight
          path: preflight.json
