services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-battery_reliability}
      POSTGRES_USER: ${POSTGRES_USER:-battery_reliability}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-battery_reliability}
      POSTGRES_USER: ${POSTGRES_USER:-battery_reliability}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DASHBOARD_POSTGRES_PASSWORD: ${DASHBOARD_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -v dashboard_password=\"$$DASHBOARD_POSTGRES_PASSWORD\" -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -f /sql/001_analytics.sql -f /sql/002_drop_legacy_ev.sql -f /sql/003_dashboard_role.sql"]
    volumes:
      - ./sql:/sql:ro

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  topic-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >-
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
      --topic battery_measurements --partitions 3 --replication-factor 1

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: battery-reliability-spark:4.1.3
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"
      - "8080:8080"

  spark-worker-1:
    image: battery-reliability-spark:4.1.3
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
    depends_on:
      - spark-master
    ports:
      - "8081:8081"

  spark-worker-2:
    image: battery-reliability-spark:4.1.3
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
    depends_on:
      - spark-master
    ports:
      - "8082:8081"

  spark-submit:
    image: battery-reliability-spark:4.1.3
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    command: >-
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      /opt/project/src/spark_pipeline.py
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2

  spark-stream-submit:
    image: battery-reliability-spark:4.1.3
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    command: >-
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3
      /opt/project/src/spark_streaming.py --available-now
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started

  spark-postgres-load:
    image: battery-reliability-spark:4.1.3
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-battery_reliability}
      POSTGRES_USER: ${POSTGRES_USER:-battery_reliability}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: >-
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --packages org.postgresql:postgresql:42.7.7
      /opt/project/src/postgres_loader.py --dataset battery_cycle_health
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: battery-reliability-airflow:3.3.1
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
      - airflow_data:/opt/airflow
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-battery_reliability}
      POSTGRES_USER: ${POSTGRES_USER:-battery_reliability}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: ["airflow", "standalone"]
    ports:
      - "8083:8080"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      DATABASE_URL: postgresql://analytics_dashboard:${DASHBOARD_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}@postgres:5432/${POSTGRES_DB:-battery_reliability}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      postgres-init:
        condition: service_completed_successfully

volumes:
  airflow_data:
  postgres_data:
