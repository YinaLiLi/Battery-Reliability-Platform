services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  topic-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >-
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
      --topic vehicle_telemetry --partitions 3 --replication-factor 1

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: ev-fleet-spark:4.1.3
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"
      - "8080:8080"

  spark-worker-1:
    image: ev-fleet-spark:4.1.3
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
    depends_on:
      - spark-master
    ports:
      - "8081:8081"

  spark-worker-2:
    image: ev-fleet-spark:4.1.3
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
    depends_on:
      - spark-master
    ports:
      - "8082:8081"

  spark-submit:
    image: ev-fleet-spark:4.1.3
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    command: >-
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      /opt/project/src/spark_pipeline.py
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2

  spark-stream-submit:
    image: ev-fleet-spark:4.1.3
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    command: >-
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3
      /opt/project/src/spark_streaming.py --available-now
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: ev-fleet-airflow:3.3.1
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
      - airflow_data:/opt/airflow
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: ["airflow", "standalone"]
    ports:
      - "8083:8080"

volumes:
  airflow_data:
